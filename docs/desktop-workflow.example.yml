name: Desktop regression and build
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - name: Regression tests in an isolated profile
        shell: pwsh
        run: ./scripts/test.ps1
      - name: Compile OCR helper and package desktop app
        shell: pwsh
        run: ./scripts/build.ps1
